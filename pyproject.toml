[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot"
version = "0.1.0"
description = "AI-powered incident investigation and SRE agent MVP"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]
rag = [
    "beautifulsoup4>=4.12,<5.0",
    "chromadb>=0.5,<1.0",
    "httpx>=0.27,<1.0",
    "sentence-transformers>=3.0,<6.0",
]
llm = [
    "torch>=2.0,<3.0",
    "transformers>=4.45,<6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*", "rag*", "rag_service*", "llm*"]
exclude = ["data*", "tests*", "training*"]